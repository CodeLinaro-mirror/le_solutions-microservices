services:
  redis:
    image: redis:7.2.4-alpine
    platform: arm64
    container_name: redis
    hostname: redis
    restart: always
    command: redis-server --loglevel notice
    network_mode: "host"
  qimsdk:
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/qimsdk:1.0.2
    platform: arm64
    container_name: qimsdk-person-foot-track
    hostname: qimsdk-person-foot-track
    user: qimsdk
    restart: always
    environment:
      - XDG_RUNTIME_DIR=/dev/socket/weston
      - WAYLAND_DISPLAY=wayland-1
      - GST_DEBUG_NO_COLOR=1
      - GST_DEBUG=2
      - INPUT_TYPE=${INPUT_TYPE:-video}
      - INPUT_URL=${INPUT_URL:-/opt/sample-videos/person_sample_video.mp4}
      - REDIS_DETECTION_CHANNEL=${REDIS_DETECTION_CHANNEL_PREFIX:-detection.rz}:0
      - MODEL_PATH_PERSON=${MODEL_PATH_PERSON:-/opt/data/foot_track_net_quantized.tflite}
    command: bash qimsdk_restricted_zone.sh
    devices:
      - /dev/dri/card0
      - /dev/dri/renderD128
      - /dev/kgsl-3d0
      - /dev/video32
      - /dev/video33
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
    volumes:
      - /usr/lib/libatomic.so.1:/usr/lib/libatomic.so.1
      - /usr/lib/libatomic.so.1.2.0:/usr/lib/libatomic.so.1.2.0
      - /dev/socket/weston:/dev/socket/weston
      - /opt/qti/development:/opt/qti/development
      - /usr/lib/libgbm.so:/usr/lib/libgbm.so
      - /usr/lib/libgsl.so:/usr/lib/libgsl.so
      - /usr/lib/libgsl.so.1:/usr/lib/libgsl.so.1
      - /usr/lib/libdmabufheap.so.0:/usr/lib/libdmabufheap.so.0
      - /usr/lib/libhta_hexagon_runtime_snpe.so:/usr/lib/libhta_hexagon_runtime_snpe.so
      - /usr/lib/libPlatformValidatorShared.so:/usr/lib/libPlatformValidatorShared.so
      - /usr/lib/libSNPE.so:/usr/lib/libSNPE.so
      - /usr/lib/libSnpeDspV66Stub.so:/usr/lib/libSnpeDspV66Stub.so
