services:
  qimsdk:
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/qimsdk:1.0.1
    platform: arm64
    container_name: qimsdk-daisy-chain
    hostname: qimsdk-daisy-chain
    user: qimsdk
    restart: always
    environment:
      - XDG_RUNTIME_DIR=/dev/socket/weston
      - WAYLAND_DISPLAY=wayland-1
      - GST_DEBUG_NO_COLOR=1
      - ADSP_LIBRARY_PATH="/usr/lib/dsp/cdsp;/usr/lib/dsp/cdsp1;${ADSP_LIBRARY_PATH}"
      - GST_DEBUG=2
    command: bash qimsdk_daisy_chain.sh
    devices:
      - /dev/dri/card0
      - /dev/dri/renderD128
      - /dev/kgsl-3d0
      - /dev/video32
      - /dev/video33
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
      - /dev/fastrpc-cdsp1
    volumes:
      - /usr/lib/libatomic.so.1:/usr/lib/libatomic.so.1
      - /usr/lib/libatomic.so.1.2.0:/usr/lib/libatomic.so.1.2.0
      - /dev/socket/weston:/dev/socket/weston
      - /opt/qti/development:/opt/qti/development
