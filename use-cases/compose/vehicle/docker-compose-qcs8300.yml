services:
  nginx:
    image: nginx:1.27.2-alpine
    platform: arm64
    container_name: nginx
    restart: always
    network_mode: host
    volumes:
      - ../configs/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ../configs/nginx/solutions/camera-api.conf:/etc/nginx/solutions/camera-api.conf
      - ../configs/nginx/solutions/vehicle-analytics-api.conf:/etc/nginx/solutions/vehicle-analytics-api.conf
  mariadb:
    image: mariadb:11.6.2
    platform: arm64
    container_name: mariadb
    hostname: mariadb
    restart: always
    volumes:
      - mariadbVolume:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secretpw
    network_mode: host
  redis:
    image: redis:7.2.4-alpine
    platform: arm64
    container_name: redis
    hostname: redis
    restart: always
    command: redis-server --loglevel notice --notify-keyspace-events Kh
    network_mode: host
  camera-api:
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/camera-api:1.0.1
    platform: arm64
    container_name: camera-api
    depends_on:
      - redis
      - mariadb
      - nginx
    restart: always
    environment:
      - redisHost=172.17.0.1
      - mariadbHost=172.17.0.1
      - mariadbPass=secretpw
      - redisCameraUpdates=${REDIS_CAMERA_UPDATES_CHANNEL:-camera-api.updates}
    expose:
      - '3000'
    network_mode: host
  vehicle-analytics-api:
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/vehicle-analytics-api:1.0.0
    platform: arm64
    container_name: vehicle-analytics-api
    depends_on:
      - redis
      - mariadb
      - nginx
    restart: always
    environment:
      - redisHost=172.17.0.1
      - mariadbHost=172.17.0.1
      - mariadbPass=secretpw
      - redisVAAlertsChannel=${REDIS_ALERTS_CHANNEL:-vehicle-analytics.alerts}
      - redisVAAnalyticsChannel=${REDIS_ANALYTICS_CHANNEL:-vehicle-analytics.analytics}
      - redisCameraUpdates=${REDIS_CAMERA_UPDATES_CHANNEL:-camera-api.updates}
    expose:
      - '8080'
    network_mode: host
  vehicle-analytics-server:
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/vehicle-analytics-server:1.0.0
    platform: arm64
    container_name: vehicle-analytics-server
    depends_on:
      - redis
      - mariadb
    restart: always
    environment:
      - REDIS_HOST=172.17.0.1
      - REDIS_DETECTION_CHANNEL_PREFIX=${REDIS_DETECTION_CHANNEL_PREFIX:-detection.vehicle}
      - ALERT_CHANNEL=${REDIS_ALERTS_CHANNEL:-vehicle-analytics.alerts}
      - ANALYTICS_CHANNEL=${REDIS_ANALYTICS_CHANNEL:-vehicle-analytics.analytics}
      - UPDATES_CHANNEL=${REDIS_UPDATES_CHANNEL:-vehicle-analytics.updates}
      - MARIADB_PASSWORD=secretpw
      - MARIADB_HOST=172.17.0.1
      - MARIADB_PORT=3306
      - MARIADB_USER=root
      - MARIADB_DEFAULT=iot_solutions
      - DEFAULT_HEATMAP_TABLE=heatmap_statistics
      - DEFAULT_COUNT_TABLE=count_statistics
      - DEFAULT_HEATMAP_ROWS=64
      - DEFAULT_HEATMAP_COLS=64
    network_mode: host
  qimsdk:
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/qimsdk:1.0.5
    platform: arm64
    container_name: qimsdk-vehicle-detection
    hostname: qimsdk-vehicle-detection
    user: qimsdk
    restart: always
    environment:
      - XDG_RUNTIME_DIR=/dev/socket/weston
      - WAYLAND_DISPLAY=wayland-1
      - GST_PLUGIN_SCANNER=/usr/lib/aarch64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      - GST_DEBUG_NO_COLOR=1
      - GST_DEBUG=2
      - INPUT_TYPE=${INPUT_TYPE:-video}
      - INPUT_URL=${INPUT_URL:-/etc/media/sample-videos/Street_Bridge.ts}
      - REDIS_DETECTION_CHANNEL=${REDIS_DETECTION_CHANNEL_PREFIX:-detection.vehicle}:0
      - MODEL_PATH_VEHICLE=${MODEL_PATH_VEHICLE:-/etc/models/yolox-yolo-x-w8a8.tflite}
      - MODEL_OFFSETS_VEHICLE=${MODEL_OFFSETS_VEHICLE:-<38.0,0.0,0.0>}
      - MODEL_SCALES_VEHICLE=${MODEL_SCALES_VEHICLE:-<3.6124823093414307,0.003626860911026597,1.0>}
      - LABELS_PATH_VEHICLE=${LABELS_PATH_VEHICLE:-/etc/labels/yolov8n.labels}
      - REDIS_OUT_PORT=${REDIS_OUT_PORT:-6379}
      - OUT_PORT=${OUT_PORT:-8900}
    command: bash /etc/media/qimsdk_vehicle_detect.sh
    volumes:
      - /etc/labels:/etc/labels
      - /etc/media:/etc/media
      - /etc/models:/etc/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - qualcomm.com/device=cdi-hw-acc
    network_mode: host
volumes:
  mariadbVolume: null