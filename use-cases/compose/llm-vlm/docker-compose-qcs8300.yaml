services:
  genai-llm-vlm-service:
    platform: ${TARGET_ARCH:-linux/arm64}
    image: softwarecenter.qualcomm.com/download/depot/services/iot-microservices/linux/genai-llm-vlm-service:1.0.0
    container_name: genai-llm-vlm-service
    hostname: genai-chatcompletion
    working_dir: /mnt/work/models
    user: root
    ports:
      - "${GENAI_PORT:-9001}:${GENAI_PORT:-9001}"
    environment:
      - LOG_LEVEL=ERROR
      - GENAI_PORT=${GENAI_PORT:-9001}
      - VLM_LIBRARY_PATH=${VLM_LIBRARY_PATH:-/iot-user/app/site-packages/libvlmservice.so}
      - LLM_LIBRARY_PATH=${LLM_LIBRARY_PATH:-/iot-user/app/site-packages/libllmservice.so}
      - GENAI_INTERFACE_FILE=${GENAI_INTERFACE_FILE:-/usr/include/genai_interface.h}
      - GENAI_MODELS_CONFIG_PATH=${GENAI_MODELS_CONFIG_PATH:-/iot-user/app/site-packages/models_config.json}
    # Memory and resource limits for VLM model loading
    deploy:
      resources:
        limits:
          memory: 12G  # VLM models typically need 8-12GB+ for loading and inference
        reservations:
          memory: 8G   # Reserve at least 8GB
    # Alternative memory limit syntax (use if deploy.resources doesn't work)
    mem_limit: 12g
    memswap_limit: 12g
    # Prevent OOM killer from terminating the container
    oom_kill_disable: false
    # Increase shared memory size for model loading
    shm_size: 2g
    devices:
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
    volumes:
      - /usr/lib/libdmabufheap.so.0:/usr/lib/libdmabufheap.so.0
      - /usr/lib/libcdsprpc.so:/usr/lib/libcdsprpc.so
      - ${GENAI_MODEL_DIR:-/etc/models/}:/mnt/work/models/
    command: sh -c "ln -sf /iot-user/app/site-packages/sampler.json /mnt/work/models/sampler.json && hypercorn openapi_server.main:app --bind 0.0.0.0:${GENAI_PORT:-9001} --log-level error 2>&1 | grep -vE '\\[INFO\\]|Loading model config|Successfully loaded config|Allocated total size'"
