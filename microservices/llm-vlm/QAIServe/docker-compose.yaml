# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yaml — QAIServe unified inference server
#
# Architecture:
#   - Stage 0 (LiteRT_builder): ubuntu:22.04 AMD64 — cross-compiles LiteRT for AArch64
#   - Stage 1 (builder):        debian:bookworm-slim ARM64 — builds all C++ targets
#   - Stage 2 (stager):         debian:bookworm-slim ARM64 — cherry-picks runtime .so files
#   - Stage 3 (runtime):        gcr.io/distroless/cc-debian12 ARM64 — minimal runtime image
#
# Build context: llm-vlm/  (parent directory)
# Usage:
#   cd llm-vlm/
#   docker compose -f QAIServe/docker-compose.yaml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Runtime service ──────────────────────────────────────────────────────────
  qaiserve-service:
    platform: ${TARGET_ARCH:-linux/arm64}
    image: qaiserve-server:latest
    container_name: qaiserve-server
    hostname: qaiserve
    working_dir: /mnt/work/models
    build:
      context: ..
      dockerfile: QAIServe/Dockerfile
      target: qaiserve-runtime
    ports:
      - "${QAISERVE_PORT:-9002}:${QAISERVE_PORT:-9002}"
      - "${GRPC_SERVER_PORT:-50051}:${GRPC_SERVER_PORT:-50051}"

    # DSP/DMA device access — GIDs are detected dynamically at startup
    devices:
      - /dev/dma_heap/system
      - /dev/fastrpc-cdsp
      - /dev/fastrpc-cdsp1

    # Required capabilities for DSP access and resource limit management
    cap_add:
      - SYS_RESOURCE

    # Memory limits
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    oom_score_adj: -200

    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 8G

    stop_signal: SIGTERM
    stop_grace_period: 20s

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      - QAISERVE_PORT=${QAISERVE_PORT:-9002}
      - GRPC_SERVER_PORT=${GRPC_SERVER_PORT:-50051}
      - GENAI_MODELS_DIR=/mnt/work/models
      - ADSP_LIBRARY_PATH=/usr/lib/rfsa/adsp
      - CDSP_LIBRARY_PATH=/usr/lib/rfsa/adsp
      - QAISERVE_MAX_BODY_SIZE=${QAISERVE_MAX_BODY_SIZE:-16777216}

      # Generative AI workers (GenIE — LLM + VLM)
      - GENAI_WORKER_BINARY=/usr/bin/genai-inference-worker
      - GENAI_VLM_WORKER_BINARY=/usr/bin/genai-vlm-inference-worker
      - GENAI_CONTEXT_CAPPING=${GENAI_CONTEXT_CAPPING:-1024}
      - MAX_ACTIVE_MODELS=${MAX_ACTIVE_MODELS:-3}

      # QNN Predictive AI worker
      - QNN_WORKER_BINARY=/usr/bin/qnn-inference-worker
      - QNN_BACKEND_LIB=/usr/lib/libQnnHtp.so
      - QNN_SYS_LIB=/usr/lib/libQnnSystem.so

      # SNPE Predictive AI worker
      - SNPE_WORKER_BINARY=/usr/bin/snpe-inference-worker
      - SNPE_DELEGATE=${SNPE_DELEGATE:-dsp}

      # LiteRT Predictive AI worker
      - LITERT_WORKER_BINARY=/usr/bin/litert-inference-worker
      - LITERT_DISPATCH_DIR=/usr/lib
      - LITERT_COMPILER_PLUGIN_DIR=/usr/lib
      - LITERT_HW_ACCELERATORS=${LITERT_HW_ACCELERATORS:-5}

      # LiteRT-LM generative AI worker (LLM inference via LiteRT-LM on Qualcomm NPU)
      - LITERT_LM_WORKER_BINARY=/usr/bin/litert-lm-inference-worker
      - LITERT_LM_BACKEND=${LITERT_LM_BACKEND:-npu}

    volumes:
      # fastrpc reads the device model name from this file to select the
      # correct DSP library path from hexagon-dsp-binaries.yaml
      - /sys/firmware/devicetree/base/model:/run/device-model:ro
      # Qualcomm platform config directory — the C++ binary copies
      # /etc/fastrpc/hexagon-dsp-binaries.yaml into conf.d/ at startup
      - /usr/share/qcom:/usr/share/qcom
      # Model bundles directory
      - ${GENAI_MODEL_DIR:-/etc/models/}:/mnt/work/models/
