services:
  genai-llm-vlm-service:
    platform: ${TARGET_ARCH:-linux/arm64}
    image: artifacts.codelinaro.org/iot-solutions-microservices/genai-llm-vlm-service:latest
    container_name: genai-llm-vlm-service
    hostname: genai-chatcompletion
    working_dir: /mnt/work/models
    ports:
      - "${GENAI_PORT:-9001}:${GENAI_PORT:-9001}"
    # Add capability to allow process to modify resource limits
    cap_add:
      - SYS_RESOURCE
    # Set ulimits for the container (inherited by all child processes)
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Adjust OOM score to prevent premature killing
    oom_score_adj: -200
    deploy:
      resources:
        limits:
          # Safety Cap: Leave 1GB for Host OS.
          # If 'free -h' shows 7GB total, set this to 6G.
          memory: 10G
        reservations:
          memory: 8G
    # Send SIGTERM first
    stop_signal: SIGTERM
    # Give process 20 seconds to exit
    stop_grace_period: 20s
    environment:
      - LOG_LEVEL=ERROR
      - GENAI_PORT=${GENAI_PORT:-9001}
      - GENAI_CONTEXT_CAPPING=${GENAI_CONTEXT_CAPPING:-2048}
      - MAX_ACTIVE_MODELS=${MAX_ACTIVE_MODELS:-2}
    devices:
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
    volumes:
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/share/qcom:/usr/share/qcom
      - ${GENAI_MODEL_DIR:-/opt/models/}:/mnt/work/models/
    command: ["hypercorn", "openapi_server.main:app", "--bind", "0.0.0.0:${GENAI_PORT:-9001}"]
