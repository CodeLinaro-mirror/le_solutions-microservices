openapi: "3.0.3"
info:
  title: "Audio Analytics API"
  version: "1.0.0"
  description: |
    # Audio Analytics API - Documentation
    
    Welcome to the Audio Analytics API, a powerful REST API providing AI-powered audio processing services including speech recognition, text translation, and speech synthesis.
    
    ## 🎯 Core Services
    
    ### 1. Speech-to-Text (ASR - Automatic Speech Recognition)
    Convert spoken audio into written text using state-of-the-art Whisper models.
    
    **Key Features:**
    - **File-based transcription**: Upload audio files (WAV) for transcription
    - **Streaming transcription**: Get real-time partial results as audio is processed
    - **Live audio streaming**: Stream audio chunks via WebSocket for real-time transcription
    - **Language detection**: Automatic language identification
    - **Multiple sample rates**: Support for 16kHz (recommended), with automatic resampling
    - **Mono/Stereo support**: Automatic channel conversion
    
    **Supported Audio Formats:**
    - WAV (PCM, 16-bit recommended)
    
    **Recommended Audio Specifications:**
    - Sample Rate: 16000 Hz
    - Channels: 1 (mono)
    - Bit Depth: 16-bit
    - Max File Size: 25 MB
    
    ### 2. Text-to-Text Translation (T2T)
    Translate text between multiple languages using Opus and NLLB models.
    
    **Key Features:**
    - **Batch translation**: Translate multiple texts in a single request
    - **Multiple language pairs**: English ↔ Chinese, English ↔ Spanish, and more
    - **Automatic language detection**: Optional source language detection
    - **Preserves formatting**: Maintains text structure
    
    **Supported Language Pairs:**
    - English (en) ↔ Chinese (zh)
    - English (en) ↔ Spanish (es)
    - Spanish (es) ↔ English (en)
    - Chinese (zh) ↔ English (en)
    
    **Translation Limits:**
    - Max text length: 1024 characters per text (model/language-dependent)
    - Max batch size: 100 texts per request (model-dependent)
    
    ### 3. Text-to-Speech (TTS)
    Generate natural-sounding speech from text using MeloTTS models.
    
    **Key Features:**
    - **Multiple languages**: English, Spanish, Chinese
    - **Multiple voices**: Different voice options per language
    - **Configurable sample rates**: 44100 Hz, 22050 Hz, 16000 Hz
    - **Automatic resampling**: Request any supported sample rate
    - **Streaming output**: Audio streamed via HTTP chunked transfer encoding
    - **WAV format**: Standard WAV output for maximum compatibility
    
    **Supported Languages:**
    - English (en) - Multiple voice options
    - Spanish (es) - Multiple voice options
    - Chinese (zh) - Multiple voice options
    
    **Audio Output Specifications:**
    - Format: PCM (raw audio data, not WAV)
    - Native Sample Rate: 44100 Hz
    - Supported Sample Rates: 44100, 22050, 16000 Hz (resampled if requested)
    - Channels: 1 (mono)
    - Bit Depth: 16-bit
    
    **Converting PCM to WAV:**
    The TTS service returns raw PCM audio data. To convert it to a playable WAV file, use the provided `pcm_to_wav.py` script:
    ```bash
    python pcm_to_wav.py speech.pcm speech.wav --rate 44100 --channels 1 --bits 16
    ```
    
    ## 🚀 Getting Started
    
    ### Step 1: Check Service Health
    ```bash
    curl http://<device-ip>:8085/audio-analytics/v1/api/health
    ```
    
    ### Step 2: Discover Available Models
    ```bash
    # List ASR models
    curl http://<device-ip>:8085/audio-analytics/v1/api/transcriptions/models
    
    # List translation models
    curl http://<device-ip>:8085/audio-analytics/v1/api/translations/models
    
    # List TTS models and voices
    curl http://<device-ip>:8085/audio-analytics/v1/api/tts/models
    ```
    
    ### Step 3: Use the Services
    
    **Transcribe Audio:**
    ```bash
    curl -X POST http://<device-ip>:8085/audio-analytics/v1/api/transcriptions/create \
      -F "file=@audio.wav" \
      -F "model=whisper-small" \
      -F "language=en" \
      -F "stream=false"
    ```
    
    **Translate Text:**
    ```bash
    curl -X POST http://<device-ip>:8085/audio-analytics/v1/api/translations/translate \
      -H "Content-Type: application/json" \
      -d '{"text":["Hello world"],"model":"opus-en-es","source_language":"en","target_language":"es"}'
    ```
    
    **Synthesize Speech:**
    ```bash
    curl -X POST http://<device-ip>:8085/audio-analytics/v1/api/tts/synthesize \
      -H "Content-Type: application/json" \
      -d '{"text":"Hello world","model":"melo-tts-en","language":"en","voice":"default"}' \
      --output speech.pcm
    
    # Convert PCM to WAV for playback
    python pcm_to_wav.py speech.pcm speech.wav --rate 44100 --channels 1 --bits 16
    ```
    
    ## 🌐 Base URLs
    
    - **Development**: `http://<device-ip>:8085/audio-analytics/v1/api`
    - **Production**: `http://<device-ip>:8085/audio-analytics/v1/api`
    - **Swagger UI**: `http://<device-ip>:8085/docs` (or `http://<device-ip>:8085/docs`)
    
    ## 🔐 Authentication
    
    Currently, no authentication is required. Future versions may implement:
    - API key authentication
    - OAuth 2.0
    - JWT tokens
    
    ## ⚡ Rate Limiting
    
    No rate limiting is currently enforced. However, clients should:
    - Implement exponential backoff for retries
    - Respect server resources
    - Avoid excessive concurrent requests
    - Cache results when appropriate
    
    ## 📊 Response Formats
    
    All responses use standard HTTP status codes:
    - **2xx**: Success
    - **4xx**: Client errors (invalid request, missing parameters)
    - **5xx**: Server errors (internal errors, service unavailable)
    
    **Success Response Format:**
    ```json
    {
      "result_field": "value",
      ...
    }
    ```
    
    **Error Response Format:**
    ```json
    {
      "error": {
        "message": "Human-readable error description",
        "type": "error_type",
        "param": "parameter_name",
        "code": "error_code"
      }
    }
    ```
    
    ## 🔄 WebSocket Streaming
    
    For real-time audio processing, the API supports WebSocket connections:
    
    1. Create a streaming session via `/transcriptions/create` with `stream=true`
    2. Connect to WebSocket at `ws://<host>:8085/stream`
    3. Send audio chunks as base64-encoded JSON messages
    4. Receive partial transcription results in real-time
    5. Receive final complete transcription
    
    **WebSocket URL:** `ws://<device-ip>:8085/stream`
    
    ## 📝 Best Practices
    
    ### Audio Preparation (ASR)
    - Convert to mono (1 channel) for best results
    - Resample to 16kHz for optimal performance
    - Use WAV format when possible (lossless)
    - Keep file sizes under 25 MB
    - Remove background noise if possible
    
    ### Translation
    - Keep texts under 1024 characters for best results
    - Use batch translation for multiple texts
    - Specify source language when known (faster processing)
    - Handle special characters and formatting appropriately
    
    ### Text-to-Speech
    - Keep text under 2000 characters per request
    - Use appropriate punctuation for natural pauses
    - Select the correct language and voice
    - Choose sample rate based on your use case:
      - 44100 Hz: High quality, larger files
      - 22050 Hz: Good quality, medium files
      - 16000 Hz: Acceptable quality, smaller files
    
    ## 🐛 Error Handling
    
    Implement proper error handling in your applications:
    
    ```python
    try:
        response = requests.post(url, ...)
        response.raise_for_status()
        result = response.json()
    except requests.exceptions.HTTPError as e:
        if response.status_code == 400:
            # Handle bad request
        elif response.status_code == 500:
            # Handle server error
    except requests.exceptions.Timeout:
        # Handle timeout
    except requests.exceptions.ConnectionError:
        # Handle connection error
    ```
    
    ## 📚 Additional Resources
    
    - **Developer Guide**: See DEVELOPER.md for comprehensive examples
    - **Deployment Guide**: See HOST-DEPLOYMENT-GUIDE.md for production setup
    - **Models Configuration**: See models.json documentation below
    - **GitHub Repository**: [Repository URL]
    - **Support Forums**: https://mysupport.qualcomm.com/supportforums/s/
    
    ## 🔧 Models Configuration (models.json)
    
    The Audio Analytics API uses a `models.json` configuration file to define available models for ASR, translation, and TTS services.
    
    **Configuration File Location:**
    - Default: `/opt/audio/models/models.json`
    - Can be customized via `MODELS_CONFIG` environment variable
    - Models directory: `/opt/audio/models` (customizable via `MODELS_DIR` environment variable)
    
    **Environment Variables:**
    - `MODELS_DIR`: Directory containing model files (default: `/opt/audio/models`)
    - `MODELS_CONFIG`: Full path to models.json file (default: `/opt/audio/models/models.json`)
    
    **Configuration Structure:**
    The models.json file contains three main sections:
    - `asr`: ASR model configurations (Whisper models)
    - `translation`: Translation model configurations (Opus/NLLB models)
    - `tts`: TTS model configurations (MeloTTS models)
    
    Each model entry includes:
    - Model name, display name, version, and description
    - Capabilities (streaming, batch processing, language detection, etc.)
    - Parameters (max file size, supported formats, sample rates, etc.)
    - Model file paths (encoder, decoder, vocab, etc.)
    
    **Example models.json structure:**
    ```json
    {
      "asr": {
        "default_model": "whisper-small",
        "models": [
          {
            "name": "whisper-small",
            "display_name": "Whisper Small",
            "version": "1.0.0",
            "description": "OpenAI Whisper small model",
            "capabilities": {
              "streaming": true,
              "file_based": true,
              "language_detection": true
            },
            "parameters": {
              "max_file_size_mb": 25,
              "supported_formats": ["wav"],
              "sample_rates": [16000]
            },
            "model_path": "/opt/audio/models/whisper/encoder_model_htp.bin",
            "vocab_path": "/opt/audio/models/whisper/vocab.bin",
            "decoder_path": "/opt/audio/models/whisper/decoder_model_htp.bin",
            "speech_path": "/opt/audio/models/whisper/speech_float.eai"
          }
        ]
      },
      "translation": {
        "default_model": "opus-en-zh",
        "models": [...]
      },
      "tts": {
        "default_model": "melo-tts-en",
        "models": [...]
      }
    }
    ```
    
    For complete models.json documentation and examples, see the repository's `audio-analytics-server/engine/config/models.json` file.
    
    ## 📄 API Versioning
    
    Current version: **v1.0.0**
    
    The API follows semantic versioning:
    - Major version: Breaking changes
    - Minor version: New features (backward compatible)
    - Patch version: Bug fixes (backward compatible)
    
    ## 🔔 Changelog
    
    ### Version 1.0.0 (Current)
    - Initial release
    - ASR with Whisper models
    - Translation with Opus/NLLB models
    - TTS with MeloTTS models
    - WebSocket streaming support
    - Multiple language support
    
