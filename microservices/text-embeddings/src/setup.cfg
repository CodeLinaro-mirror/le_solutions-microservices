[metadata]
name = openapi_server
version = 1.0.1
description = OpenAI-compliant API for creating embeddings using Qualcomm 9100/9075 devices
long_description = file: README.md
keywords = OpenAPI Embeddings generation and Models listing API
python_requires = >= 3.7.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7

[options]
install_requires =
    # Inference dependencies
    numpy>=1.24.0
    tokenizers>=0.21.0
    # Web framework
    fastapi==0.115.2
    hypercorn==0.16.0
    starlette==0.40.0
    pydantic>=2
    python-multipart==0.0.18
    orjson==3.9.15
    aiofiles==23.1.0
    Jinja2==3.1.4
    MarkupSafe==2.0.1
    # Hypercorn dependencies
    click==7.1.2
    h11==0.14.0
    httptools>=0.3.0,<0.7.0
    uvloop>=0.20.0
    watchgod==0.7
    websockets==10.0
    # HTTP / networking
    certifi==2024.7.4
    httpx==0.24.1
    requests==2.32.5
    urllib3==1.26.19
    idna==3.7
    # Utilities
    python-dotenv==0.17.1
    PyYAML>=5.4.1,<6.1.0
setup_requires = setuptools
package_dir = =web-api
packages = find_namespace:

[options.package_data]
openapi_server =
    configs/*.json

[options.packages.find]
where = web-api
