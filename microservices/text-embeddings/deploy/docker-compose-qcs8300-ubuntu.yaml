services:
  genai_t2e:
    platform: ${TARGET_ARCH:-linux/arm64}
    image: genai_service_t2e
    container_name: genai_service_t2e
    hostname: genai_t2e
    ports:
      - "${GENAI_T2E_PORT:-9090}:9090"
    environment:
      - GENAI_T2I_PORT=9090
      - GENAI_MODELS_CONFIG_PATH=${GENAI_MODELS_CONFIG_PATH:-/opt/embed_gen/models_config.json}
      - TOKENIZER_DIR=/opt/embed_gen/nomic_tokenizer
    devices:
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
    volumes:
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/share/qcom:/usr/share/qcom
      - ${MODELS_PATH:-/opt/embed_gen}:/opt/embed_gen/
    command: ["hypercorn", "openapi_server.main:app", "--bind", "0.0.0.0:${GENAI_T2E_PORT}"]
