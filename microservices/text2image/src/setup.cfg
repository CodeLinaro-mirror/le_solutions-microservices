[metadata]
name = openapi_server
version = 1.0.0
description = OpenAI-compliant API for generating images using Qualcomm 9100/9075 devices.
long_description = file: README.md
keywords = OpenAPI Image Generation and Model Listing API
python_requires = >= 3.7.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7

[options]
install_requires =
    aiofiles==23.1.0
    aniso8601==7.0.0
    async-exit-stack==1.0.1
    async-generator==1.10
    certifi==2024.7.4
    chardet==4.0.0
    click==7.1.2
    dnspython==2.6.1
    email-validator==2.0.0
    fastapi==0.115.2
    graphene==2.1.8
    graphql-core==2.3.2
    graphql-relay==2.0.1
    h11==0.14.0
    httptools>=0.3.0,<0.7.0
    httpx==0.24.1
    idna==3.7
    itsdangerous==1.1.0
    Jinja2==3.1.4
    MarkupSafe==2.0.1
    orjson==3.9.15
    promise==2.3
    pydantic>=2
    python-dotenv==0.17.1
    python-multipart==0.0.18
    PyYAML>=5.4.1,<6.1.0
    requests==2.32.0
    Rx==1.6.1
    starlette==0.40.0
    ujson==4.0.2
    urllib3==1.26.19
    hypercorn==0.16.0
    watchgod==0.7
    websockets==10.0
    numpy==2.2.6
    torch==2.9.1
    diffusers==0.35.2
    transformers==4.57.1
    jsonschema==4.25.1
    pillow==12.0.0
setup_requires = setuptools
package_dir = =web-api
packages = find_namespace:

[options.packages.find]
where = web-api
