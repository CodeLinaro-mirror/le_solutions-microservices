services:
  genai_t2i:
    platform: ${TARGET_ARCH:-linux/arm64}
    image: genai_service_t2i
    container_name: genai_service_t2i
    hostname: genai_t2i
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    ports:
      - "${GENAI_T2I_PORT:-9090}:${GENAI_T2I_PORT:-9090}"
    working_dir: /mnt/work/models
    environment:
      - GENAI_T2I_PORT=${GENAI_T2I_PORT:-9090}
    devices:
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
      - /dev/fastrpc-cdsp1
    volumes:
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/lib/dsp/cdsp/libc++.so.1:/usr/lib/dsp/cdsp/libc++.so.1
      - /usr/lib/dsp/cdsp/libc++abi.so.1:/usr/lib/dsp/cdsp/libc++abi.so.1
      - /usr/lib/dsp/cdsp/fastrpc_shell_3:/usr/lib/dsp/cdsp/fastrpc_shell_3
      - /usr/lib/dsp/cdsp/fastrpc_shell_unsigned_3:/usr/lib/dsp/cdsp/fastrpc_shell_unsigned_3
      # Uncomment the following to run the container on IQ9
      # - /usr/lib/dsp/cdsp1/libc++.so.1:/usr/lib/dsp/cdsp1/libc++.so.1
      # - /usr/lib/dsp/cdsp1/libc++abi.so.1:/usr/lib/dsp/cdsp1/libc++abi.so.1
      # - /usr/lib/dsp/cdsp1/fastrpc_shell_4:/usr/lib/dsp/cdsp1/fastrpc_shell_4
      # - /usr/lib/dsp/cdsp1/fastrpc_shell_unsigned_4:/usr/lib/dsp/cdsp1/fastrpc_shell_unsigned_4
      - ${T2I_MODEL_DIR:-/opt/image_gen}:/mnt/work/models/
    command: sh -c "hypercorn openapi_server.main:app --bind 0.0.0.0:${GENAI_T2I_PORT:-9090} --reload"
