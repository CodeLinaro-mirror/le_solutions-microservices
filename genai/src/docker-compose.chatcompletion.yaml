services:
  genai-builder:
    user: root
    platform: ${HOST_ARCH}
    image: genai-llm-vlm-service-builder
    container_name: genai-llm-vlm-service-builder
    hostname: genai
    build:
      context: .
      dockerfile: Dockerfile.chatcompletion
      target: genai-llm-vlm-service-builder
    volumes:
      - ./genai-lib:/mnt/work/src/genai-lib
      - ./web-api:/mnt/work/src/web-api
    command: tail -f /dev/null

  genai-llm-vlm-service:
    platform: ${TARGET_ARCH:-linux/arm64}
    image: genai-llm-vlm-service
    container_name: genai-llm-vlm-service
    hostname: genai-chatcompletion
    working_dir: /mnt/work/models
    build:
      context: .
      dockerfile: Dockerfile.chatcompletion
      target: genai-llm-vlm-service
    ports:
      - "${GENAI_PORT:-9001}:${GENAI_PORT:-9001}"
    # Add capability to allow process to modify resource limits
    cap_add:
      - SYS_RESOURCE
    # Set ulimits for the container (inherited by all child processes)
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Adjust OOM score to prevent premature killing
    oom_score_adj: -200
    deploy:
      resources:
        limits:
          # Safety Cap: Leave 1GB for Host OS.
          # If 'free -h' shows 7GB total, set this to 6G.
          memory: 10G
        reservations:
          memory: 8G
    # Send SIGTERM first
    stop_signal: SIGTERM
    # Give process 20 seconds to exit
    stop_grace_period: 20s
    environment:
      - LOG_LEVEL=ERROR
      - GENAI_PORT=${GENAI_PORT:-9001}
      - VLM_LIBRARY_PATH=${VLM_LIBRARY_PATH:-/iot-user/app/site-packages/libvlmservice.so}
      - LLM_LIBRARY_PATH=${LLM_LIBRARY_PATH:-/iot-user/app/site-packages/libllmservice.so}
      - GENAI_INTERFACE_FILE=${GENAI_INTERFACE_FILE:-/usr/include/genai_interface.h}
      - GENAI_CONTEXT_CAPPING=${GENAI_CONTEXT_CAPPING:-1024}
      - MAX_ACTIVE_MODELS=${MAX_ACTIVE_MODELS:-3}
    devices:
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
      - /dev/fastrpc-cdsp1
    volumes:
      - /usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:/usr/lib/libdmabufheap.so.0
      - /usr/lib/aarch64-linux-gnu/libcdsprpc.so:/usr/lib/libcdsprpc.so
      - ${GENAI_MODEL_DIR:-/etc/models/}:/mnt/work/models/
    command: ["hypercorn", "openapi_server.main:app", "--bind", "0.0.0.0:${GENAI_PORT:-9001}"]
