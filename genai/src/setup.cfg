[metadata]
name = openapi_server
version = 1.0.0
description = These REST APIs provide the capability to run inference on Qualcomm 9100 devices.
long_description = file: README.md
keywords = OpenAPI IOT Solutions - Gen-AI Microservice APIs
python_requires = >= 3.7.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7

[options]
install_requires =
    aiofiles==23.1.0
    aniso8601==7.0.0
    async-exit-stack==1.0.1
    async-generator==1.10
    certifi==2024.7.4
    chardet==4.0.0
    click==7.1.2
    dnspython==2.6.1
    email-validator==2.0.0
    fastapi==0.115.2
    graphene==2.1.8
    graphql-core==2.3.2
    graphql-relay==2.0.1
    h11>=0.13.0,<0.15.0
    httptools>=0.3.0,<0.7.0
    httpx==0.24.1
    idna==3.7
    itsdangerous==1.1.0
    Jinja2==3.1.4
    MarkupSafe==2.0.1
    orjson==3.9.15
    promise==2.3
    pydantic>=2,<3.0
    python-dotenv==0.17.1
    python-multipart==0.0.18
    PyYAML>=5.4.1,<6.1.0
    requests==2.32.0
    Rx==1.6.1
    starlette==0.40.0
    ujson==4.0.2
    urllib3==1.26.19
    watchgod==0.7
    websockets==10.0
    cffi==1.17.1
    hypercorn==0.16.0
setup_requires = setuptools
package_dir = =web-api
packages = find_namespace:

[options.packages.find]
where = web-api