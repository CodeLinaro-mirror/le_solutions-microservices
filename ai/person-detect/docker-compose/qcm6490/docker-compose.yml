services:
  nginx:
    image: nginx
    container_name: nginx
    restart: always
    network_mode: "host"
  mariadb:
    image: mariadb
    container_name: mariadb
    hostname: mariadb
    restart: always
    volumes:
      - /opt/init.sql:/docker-entrypoint-initdb.d/init.sql
      - /opt/data/mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secretpw
    network_mode: "host"
  redis:
    image: redis
    container_name: redis
    hostname: redis
    restart: always
    command: redis-server --loglevel notice
    network_mode: "host"
  camera-api:
    image: qartifactory-edge.qualcomm.com/qsc-docker-releases/services/iot-microservices/linux/camera-api:1.0.0
    container_name: camera-api
    depends_on:
      - redis
      - mariadb
      - nginx
    restart: always
    environment:
      - redisHost=172.17.0.1
      - mariadbHost=172.17.0.1
      - mariadbPass=secretpw
      - redisCameraUpdates=${REDIS_CAMERA_UPDATES_CHANNEL:-camera-api.updates}
    expose:
      - "3000"
    network_mode: "host"
  region-analytics-api:
    image: qartifactory-edge.qualcomm.com/qsc-docker-releases/services/iot-microservices/linux/region-analytics-api:1.0.0
    container_name: region-analytics-api
    depends_on:
      - redis
      - mariadb
      - nginx
    restart: always
    environment:
      - REDIS_HOST=172.17.0.1
      - mariadbHost=172.17.0.1
      - mariadbPass=secretpw
      - redisRAAlertsChannel=${REDIS_ALERTS_CHANNEL:-region-analytics.alerts}
      - redisCameraUpdates=${REDIS_CAMERA_UPDATES_CHANNEL:-camera-api.updates"}
    expose:
      - "8081"
    network_mode: "host"
  region-analytics-server:
    image: qartifactory-edge.qualcomm.com/qsc-docker-releases/services/iot-microservices/linux/region-analytics-server:1.0.0
    container_name: region-analytics-server
    depends_on:
      - redis
    restart: always
    environment:
      - REDIS_HOST=172.17.0.1
      - REDIS_DETECTION_CHANNEL_PREFIX=${REDIS_DETECTION_CHANNEL_PREFIX:-detection.rz}
      - ALERT_CHANNEL=${REDIS_ALERTS_CHANNEL:-region-analytics.alerts}
    network_mode: "host"
  qimsdk:
    image: qartifactory-edge.qualcomm.com/qsc-docker-releases/services/iot-microservices/linux/qimsdk:1.0.0
    container_name: qimsdk-person-detect
    hostname: qimsdk-person-detect
    user: qimsdk
    restart: always
    environment:
      - XDG_RUNTIME_DIR=/dev/socket/weston
      - WAYLAND_DISPLAY=wayland-1
      - GST_DEBUG_NO_COLOR=1
      - GST_DEBUG=2
      - INPUT_TYPE=${INPUT_TYPE:-video}
      - INPUT_URL=${INPUT_URL:-/opt/sample-videos/person_sample_video.mp4}
      - REDIS_DETECTION_CHANNEL=${REDIS_DETECTION_CHANNEL_PREFIX:-detection.rz}:0
      - MODEL_PATH_PERSON=${MODEL_PATH_PERSON:-/opt/models/foot_track_net_quantized.tflite}
    command: bash qimsdk_person_detect.sh
    devices:
      - /dev/dri/card0
      - /dev/dri/renderD128
      - /dev/kgsl-3d0
      - /dev/video32
      - /dev/video33
      - /dev/dma_heap/system
      - /dev/dma_heap/qcom,system
      - /dev/fastrpc-cdsp
    volumes:
      - /usr/lib/libatomic.so.1:/usr/lib/libatomic.so.1
      - /usr/lib/libatomic.so.1.2.0:/usr/lib/libatomic.so.1.2.0
      - /dev/socket/weston:/dev/socket/weston
      - /opt/qti/development:/opt/qti/development
